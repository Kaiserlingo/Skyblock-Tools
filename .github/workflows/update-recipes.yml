name: Rezepte aktualisieren

# Holt einmal pro Woche die aktuellen Crafting-Rezepte aus dem NotEnoughUpdates-REPO
# und schreibt sie nach data/recipes.json. Kann unter "Actions" auch manuell gestartet werden.
on:
  schedule:
    - cron: "17 4 * * 1"   # jeden Montag 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: NEU-Repo holen (nur Items)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NotEnoughUpdates/NotEnoughUpdates-REPO.git neu
          git -C neu sparse-checkout set items

      - name: Rezepte erzeugen
        run: python3 tools/update_recipes.py neu/items data/recipes.json

      - name: Änderungen committen
        run: |
          rm -rf neu
          if git diff --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipes.json
          git commit -m "Rezepte aus NEU-Repo aktualisiert"
          git push
