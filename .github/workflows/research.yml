name: Forschungsdaten (Prognose)

# Nur manuell: exportiert komplette Preisverläufe für die Entwicklung der Preisprognose.
on:
  workflow_dispatch:
    inputs:
      ah:
        description: "Anzahl Auction-House-Items"
        required: false
        default: "600"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/research_dump.mjs "${{ github.event.inputs.ah }}"
      - name: Auf Branch "research" ablegen
        run: |
          mkdir pub && mv research.json.gz pub/ && cd pub
          git init -q -b research && git add research.json.gz
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Forschungsdaten"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" research
